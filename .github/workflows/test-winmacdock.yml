name: Check publisher setup
on:
  push:
    branches: [test-winmacdock-1.0.0]
permissions:
  contents: read
jobs:
  setup:
    if: github.repository == 'edcadet10/winget-pkgs'
    runs-on: windows-2025
    timeout-minutes: 7
    steps:
      - name: Run the publisher's x64 installer with its documented silent switch
        shell: pwsh
        run: |
          $name = 'WinMac-Dock-1.0.0-x64-Setup.exe'
          $path = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest "https://github.com/Asteski/WinMac-Dock/releases/download/v1.0.0/$name" -OutFile $path
          if ((Get-FileHash $path).Hash -ne 'C05BE39BF158198B2CBA09F9E7C7DCE753C1A6B4EB184680FD765007CE1A6839') { throw 'Installer digest changed' }
          $proc = Start-Process -FilePath $path -ArgumentList '/S' -PassThru
          if ($proc.WaitForExit(90000)) {
            if ($proc.ExitCode) { throw "Publisher setup exited with code $($proc.ExitCode)" }
            Get-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\WinMacDock' | Format-List DisplayName, Publisher, DisplayVersion, UninstallString, QuietUninstallString
            exit 0
          }
          Get-CimInstance Win32_Process | Where-Object { $_.ProcessId -eq $proc.Id -or $_.ParentProcessId -eq $proc.Id -or $_.Name -match 'WinMac' } | Format-List Name, ProcessId, ParentProcessId, CommandLine
          Add-Type -AssemblyName UIAutomationClient
          $auto = [Windows.Automation.AutomationElement]
          $windows = $auto::RootElement.FindAll([Windows.Automation.TreeScope]::Children, [Windows.Automation.Condition]::TrueCondition)
          foreach ($win in $windows) {
            if ($win.Current.ProcessId -eq $proc.Id -or $win.Current.Name -match 'WinMac|Setup|Installer') {
              Write-Host "Window: $($win.Current.Name)"
              $win.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition) | ForEach-Object { if ($_.Current.Name) { Write-Host $_.Current.Name } }
            }
          }
          throw 'Publisher setup did not exit within 90 seconds'
