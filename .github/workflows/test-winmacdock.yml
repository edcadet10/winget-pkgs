name: Inspect WinGet install
on:
  push:
    branches: [test-winmacdock-1.0.0]
permissions:
  contents: read
jobs:
  install:
    name: Install and uninstall (${{ matrix.arch }}, ${{ matrix.scope }})
    if: github.repository == 'edcadet10/winget-pkgs'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            scope: user
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      TEST_ARCH: ${{ matrix.arch }}
      TEST_SCOPE: ${{ matrix.scope }}
    steps:
      - name: Get the manifest from this commit
        shell: pwsh
        run: |
          $path = 'manifests/a/Asteski/WinMacDock/1.0.0'
          $null = New-Item -ItemType Directory manifest
          foreach ($suffix in '.yaml', '.installer.yaml', '.locale.en-US.yaml') {
            $file = "Asteski.WinMacDock$suffix"
            $url = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/$path/$file"
            Invoke-WebRequest $url -OutFile "manifest/$file"
          }
      - name: Prepare WinGet
        shell: pwsh
        run: |
          $arch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($arch -ne $env:TEST_ARCH) { throw "Unexpected host architecture $arch" }
          $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
          if (!$winget -or [version]((& winget.exe --version).Trim().TrimStart('v')) -lt [version]'1.28.0') {
            Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser
            Repair-WinGetPackageManager -Force -Latest
          }
          winget --version
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE) { throw "Could not enable local manifests: $LASTEXITCODE" }
          winget validate --manifest manifest
          if ($LASTEXITCODE) { throw "Manifest failed validation: $LASTEXITCODE" }
      - name: Inspect a silent install on a clean runner
        shell: pwsh
        run: |
          $proc = Start-Process winget.exe -ArgumentList @('install','--manifest','manifest','--silent','--scope','user','--verbose-logs','--architecture','x64','--disable-interactivity','--accept-package-agreements','--accept-source-agreements') -NoNewWindow -PassThru
          if ($proc.WaitForExit(65000)) { exit $proc.ExitCode }
          $paths = @("$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir", "$env:LOCALAPPDATA\Microsoft\WinGet\DiagOutputDir")
          foreach ($p in $paths) {
            $log = Get-ChildItem $p -Filter 'WinGet-*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($log) {
              Get-Content $log.FullName -Tail 55 | Where-Object { $_ -match 'arg|execut|install|elevat|error|wait|launch|zone|scan|reputat' }
            }
          }
          Get-CimInstance Win32_Process | Where-Object { $_.ProcessId -eq $proc.Id -or $_.ParentProcessId -eq $proc.Id -or $_.Name -match 'WinMac|smart.?screen|consent.exe|^OpenWith|UserOOBE' } | Format-List Name, ProcessId, ParentProcessId, CommandLine
          Add-Type -AssemblyName UIAutomationClient
          $winRoot = [Windows.Automation.AutomationElement]::RootElement
          $windows = $winRoot.FindAll([Windows.Automation.TreeScope]::Children,[Windows.Automation.Condition]::TrueCondition)
          foreach ($win in $windows) {
            Write-Host "Window $($win.Current.ProcessId): $($win.Current.Name)"
            if ($win.Current.Name -match 'WinMac|Setup|Installer|Windows protected|Open File|Security|SmartScreen|reputation|publisher') {
              $win.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition) | ForEach-Object { if ($_.Current.Name) { Write-Host $_.Current.Name } }
            }
          }
          throw 'WinGet install was still waiting after 65 seconds'
