name: Test WinMac Dock
on:
  push:
    branches: [test-winmacdock-1.0.0]
permissions:
  contents: read
jobs:
  install:
    name: Install and uninstall (${{ matrix.arch }})
    if: github.repository == 'edcadet10/winget-pkgs'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      TEST_ARCH: ${{ matrix.arch }}
    steps:
      - name: Get the manifest from this commit
        shell: pwsh
        run: |
          $path = 'manifests/a/Asteski/WinMacDock/1.0.0'
          $null = New-Item -ItemType Directory manifest
          foreach ($suffix in '.yaml', '.installer.yaml', '.locale.en-US.yaml') {
            $file = "Asteski.WinMacDock$suffix"
            $url = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/$path/$file"
            Invoke-WebRequest $url -OutFile "manifest/$file"
          }
      - name: Prepare WinGet
        shell: pwsh
        run: |
          $arch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($arch -ne $env:TEST_ARCH) { throw "Unexpected host architecture $arch" }
          $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
          if (!$winget -or [version]((& winget.exe --version).Trim().TrimStart('v')) -lt [version]'1.28.0') {
            Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser
            Repair-WinGetPackageManager -Force -Latest
          }
          winget --version
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE) { throw "Could not enable local manifests: $LASTEXITCODE" }
          winget validate --manifest manifest
          if ($LASTEXITCODE) { throw "Manifest failed validation: $LASTEXITCODE" }
      - name: Verify unattended install, registration and uninstall in each scope
        shell: pwsh
        run: |
          $arch = $env:TEST_ARCH
          $key = 'Software\Microsoft\Windows\CurrentVersion\Uninstall\WinMacDock'
          function Get-Registration($scope) {
            $root = if ($scope -eq 'user') { 'HKCU:' } else { 'HKLM:' }
            foreach ($path in $key, $key.Replace('Software\Microsoft','Software\WOW6432Node\Microsoft')) {
              Get-ItemProperty -LiteralPath "$root\$path" -ErrorAction SilentlyContinue
            }
          }
          foreach ($scope in 'user', 'machine') {
            if ((Get-Registration user) -or (Get-Registration machine)) { throw 'Unexpected pre-existing installation' }
            winget install --manifest manifest --architecture $arch --scope $scope --silent --disable-interactivity --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE) { throw "Install failed on $arch/$scope with exit code $LASTEXITCODE" }
            $arp = @(Get-Registration $scope)
            if ($arp.Count -ne 1 -or $arp[0].DisplayName -cne 'WinMac Dock' -or $arp[0].Publisher -cne 'Asteski' -or $arp[0].DisplayVersion -cne '1.0.0') {
              $arp | Format-List DisplayName, DisplayVersion, Publisher, InstallLocation
              throw "Unexpected installed metadata on $arch/$scope"
            }
            $exe = Join-Path $arp[0].InstallLocation 'WinMac.Dock.exe'
            $pe = [IO.File]::ReadAllBytes($exe)
            $machine = [BitConverter]::ToUInt16($pe, [BitConverter]::ToInt32($pe, 0x3c) + 4)
            $expected = if ($arch -eq 'arm64') { 0xaa64 } else { 0x8664 }
            if ($machine -ne $expected) { throw "Installed CPU type does not match $arch" }
            winget uninstall --manifest manifest --scope $scope --silent --disable-interactivity --accept-source-agreements
            if ($LASTEXITCODE) { throw "Uninstall failed on $arch/$scope with exit code $LASTEXITCODE" }
            for ($i = 0; $i -lt 30 -and ((Get-Registration $scope) -or (Test-Path -LiteralPath $exe)); $i++) { Start-Sleep -Seconds 1 }
            if ((Get-Registration $scope) -or (Test-Path -LiteralPath $exe)) { throw "Uninstall left the application registered or installed on $arch/$scope" }
            Write-Host "Passed install, registration, CPU and uninstall for $arch/$scope."
          }
