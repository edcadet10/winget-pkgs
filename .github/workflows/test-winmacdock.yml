name: Test WinMac Dock portable packages
on:
  push:
    branches: [test-winmacdock-1.0.0]
permissions:
  contents: read
jobs:
  install:
    name: Install and uninstall (${{ matrix.arch }}, ${{ matrix.scope }})
    if: github.repository == 'edcadet10/winget-pkgs'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        scope: [user, machine]
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      TEST_ARCH: ${{ matrix.arch }}
      TEST_SCOPE: ${{ matrix.scope }}
    steps:
      - name: Get the manifest from this commit
        shell: pwsh
        run: |
          $path = 'manifests/a/Asteski/WinMacDock/1.0.0'
          $null = New-Item -ItemType Directory manifest
          foreach ($suffix in '.yaml', '.installer.yaml', '.locale.en-US.yaml') {
            $file = "Asteski.WinMacDock$suffix"
            $url = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/$path/$file"
            Invoke-WebRequest $url -OutFile "manifest/$file"
          }
      - name: Prepare WinGet
        shell: pwsh
        run: |
          $arch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($arch -ne $env:TEST_ARCH) { throw "Unexpected host architecture $arch" }
          $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
          if (!$winget -or [version]((& winget.exe --version).Trim().TrimStart('v')) -lt [version]'1.28.0') {
            Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser
            Repair-WinGetPackageManager -Force -Latest
          }
          winget --version
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE) { throw "Could not enable local manifests: $LASTEXITCODE" }
          winget validate --manifest manifest
          if ($LASTEXITCODE) { throw "Manifest failed validation: $LASTEXITCODE" }
      - name: Install through WinGet
        id: install
        shell: pwsh
        run: |
          winget install --manifest manifest --architecture $env:TEST_ARCH --scope $env:TEST_SCOPE --silent --disable-interactivity --accept-package-agreements --accept-source-agreements
          exit $LASTEXITCODE
      - name: Check registration, installed CPU type and command
        shell: pwsh
        run: |
          $root = if ($env:TEST_SCOPE -eq 'user') { 'HKCU:' } else { 'HKLM:' }
          $uninstall = 'Microsoft\Windows\CurrentVersion\Uninstall\*'
          $apps = @(Get-ItemProperty "$root\SOFTWARE\$uninstall", "$root\SOFTWARE\WOW6432Node\$uninstall" -ErrorAction SilentlyContinue | Where-Object DisplayName -CEQ 'WinMac Dock' | Sort-Object PSPath -Unique)
          if ($apps.Count -ne 1 -or $apps[0].DisplayVersion -cne '1.0.0' -or $apps[0].Publisher -cne 'Asteski') { throw 'Unexpected Apps and Features registration' }
          $app = Join-Path $apps[0].InstallLocation 'WinMac.Dock.exe'
          $pe = [IO.File]::ReadAllBytes($app)
          $machine = [BitConverter]::ToUInt16($pe, [BitConverter]::ToInt32($pe, 0x3c) + 4)
          $expected = if ($env:TEST_ARCH -eq 'arm64') { 0xaa64 } else { 0x8664 }
          if ($machine -ne $expected) { throw "Incorrect installed CPU type $machine" }
          $env:PATH = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User') + ';' + $env:PATH
          $cmd = (Get-Command winmac-dock.exe -CommandType Application -ErrorAction Stop).Source
          "DockCommand=$cmd" >> $env:GITHUB_ENV
          "DockApp=$app" >> $env:GITHUB_ENV
          "DockRegistry=$($apps[0].PSPath)" >> $env:GITHUB_ENV
          Write-Host "Verified $($apps[0].DisplayName) $($apps[0].DisplayVersion), $env:TEST_ARCH, $env:TEST_SCOPE."
      - name: Start the dock and close it with its own exit command
        shell: pwsh
        run: |
          $job = Start-Job {
            $p = Start-Process -FilePath $env:DockCommand -PassThru
            if ($p.WaitForExit(12000)) { throw "Dock exited during startup ($($p.ExitCode))" }
            $quit = Start-Process -FilePath $env:DockCommand -ArgumentList '--exit' -PassThru
            if (!$quit.WaitForExit(20000) -or $quit.ExitCode -ne 0 -or !$p.WaitForExit(20000) -or $p.ExitCode -ne 0) { throw 'Dock did not respond cleanly to its exit command' }
          }
          $null = Wait-Job $job -Timeout 60
          if ($job.State -ne 'Completed') {
            Get-Process | Where-Object { $_.ProcessName -match 'WinMac|SmartScreen' -or $_.MainWindowTitle } | Select-Object ProcessName,MainWindowTitle | Format-Table -AutoSize
            Get-Content "$env:LOCALAPPDATA\WinMac\Dock\WinMac.Dock.log" -Tail 16 -ErrorAction SilentlyContinue
            Add-Type -AssemblyName UIAutomationClient
            $windows = [Windows.Automation.AutomationElement]::RootElement.FindAll([Windows.Automation.TreeScope]::Children,[Windows.Automation.Condition]::TrueCondition)
            foreach ($win in $windows) { Write-Host "Window $($win.Current.ProcessId): $($win.Current.Name)" }
            Receive-Job $job
            throw "Dock launch check did not complete successfully ($($job.State))"
          }
          Receive-Job $job
      - name: Uninstall through WinGet and verify removal
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: |
          winget uninstall --manifest manifest --scope $env:TEST_SCOPE --silent --disable-interactivity --accept-source-agreements
          if ($LASTEXITCODE) { throw "WinGet uninstall failed ($LASTEXITCODE)" }
          foreach ($path in $env:DockRegistry, $env:DockApp, $env:DockCommand) {
            if ($path -and (Test-Path -LiteralPath $path)) { throw "Uninstall left $path behind" }
          }
